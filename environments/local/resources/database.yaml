apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: todolist-db
  namespace: todolist
spec:
  instances: 2
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  affinity:
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  bootstrap:
    initdb:
      database: todolist
      owner: todolist
      secret:
        name: todolist-db-credentials
