name: Deploy And Verify Local Platform

on:
  push:
    branches: [main]
    paths:
      - environments/local/**
      - apps/todolist/**
      - scripts/**
      - tests/**
      - .github/workflows/deploy-local.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: local-kind-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, macos, local-kind]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Argo CD synchronization
        run: sh ./scripts/wait-for-argocd.sh
      - name: Run smoke test
        run: curl --fail --retry 10 --retry-all-errors http://todolist.localhost/healthz
      - name: Run resilience test
        run: sh ./tests/ha/run.sh
      - name: Verify RBAC boundaries
        run: sh ./tests/security/rbac.sh
      - name: Collect deployment evidence
        if: always()
        run: sh ./scripts/collect-evidence.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-platform-evidence-${{ github.run_id }}
          path: evidence/generated/
          if-no-files-found: warn
          retention-days: 30
      - name: Create application installation token
        if: success()
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.TODOLIST_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.TODOLIST_AUTOMATION_APP_PRIVATE_KEY }}
          owner: mcarval4
          repositories: todolist-app
      - name: Notify the validated application release
        if: success()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          values=environments/local/todolist-values.yaml
          version=$(awk '$1 == "version:" { gsub(/"/, "", $2); print $2; exit }' "$values")
          source_revision=$(awk '$1 == "sourceRevision:" { gsub(/"/, "", $2); print $2; exit }' "$values")
          test -n "$version"
          test -n "$source_revision"
          gh api --method POST repos/mcarval4/todolist-app/dispatches \
            -f event_type=gitops-validation-succeeded \
            -f "client_payload[version]=$version" \
            -f "client_payload[source_revision]=$source_revision"
